name: Sync Google Scholar publications

# Weekly check of the Google Scholar profile for new publications. Any paper
# not already in content/publication/ is added as a draft (draft: true) and
# opened as a pull request for review - nothing is published automatically.
#
# Google Scholar has no official API; scholarly scrapes the public profile
# and Google frequently CAPTCHA-blocks requests from datacenter/CI IP ranges
# (including GitHub-hosted runners). To make this reliable, set the optional
# repository secret SCRAPERAPI_KEY (a free-tier API key from scraperapi.com)
# so requests are routed through a residential-style proxy instead of
# GitHub's IP directly. Without it, the script falls back to scholarly's
# free public proxy pool, which is best-effort and can still get blocked -
# if a run fails, re-run manually via workflow_dispatch or wait for next
# week. See README.md for setup details.

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC
  workflow_dispatch:
    inputs:
      scholar_id:
        description: "Google Scholar author ID (defaults to the site owner's profile)"
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run Scholar sync
        env:
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
        run: |
          python scripts/scholar_sync.py ${{ inputs.scholar_id && format('--scholar-id {0}', inputs.scholar_id) || '' }}

      - name: Check for new publications
        id: changes
        run: |
          if [ -n "$(git status --porcelain content/publication)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open pull request with new publications
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Add new publications found on Google Scholar"
          title: "New publications from Google Scholar"
          body-path: scripts/scholar_sync_summary.md
          branch: scholar-sync/new-publications
          delete-branch: true
          add-paths: content/publication/**
