name: Sync ORCID publications

# Weekly check of the ORCID profile for new publications. Any paper not
# already in content/publication/ is added as a draft (draft: true) and
# opened as its OWN pull request for review - nothing is published
# automatically, and each paper can be independently merged (accepted) or
# closed without merging (rejected - see orcid-sync-reject.yml, which
# records that so it isn't suggested again) without affecting any other
# paper found in the same run.
#
# Uses ORCID's public API plus Crossref (both official, key-free REST APIs)
# rather than scraping Google Scholar, so there's no CAPTCHA/blocking risk.

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC
  workflow_dispatch:
    inputs:
      orcid_id:
        description: "ORCID iD (defaults to the site owner's profile)"
        required: false
      min_year:
        description: "Only propose works published this year or later (default: current year - 5)"
        required: false
      all_years:
        description: "Consider the full ORCID history, ignoring the year cutoff"
        required: false
        type: boolean
        default: false
      include_all_types:
        description: "Include conference abstracts/posters too, instead of skipping them"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run ORCID sync
        env:
          ORCID_ID: ${{ inputs.orcid_id }}
          MIN_YEAR: ${{ inputs.min_year }}
          ALL_YEARS: ${{ inputs.all_years }}
          INCLUDE_ALL_TYPES: ${{ inputs.include_all_types }}
        run: |
          args=()
          [ -n "$ORCID_ID" ] && args+=(--orcid-id "$ORCID_ID")
          if [ "$ALL_YEARS" = "true" ]; then
            args+=(--all-years)
          elif [ -n "$MIN_YEAR" ]; then
            args+=(--min-year "$MIN_YEAR")
          fi
          [ "$INCLUDE_ALL_TYPES" = "true" ] && args+=(--include-all-types)
          python scripts/orcid_sync.py "${args[@]}"

      - name: Open one pull request per new publication
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/orcid_open_prs.py
