name: Build and deploy site

# Builds the Hugo site and uploads it to 123-reg (or any cPanel/FTP) hosting.
# Replaces the previous Netlify-based deployment.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   FTP_SERVER       - hostname or IP of the FTP/FTPS server (e.g. ftp.mark-a-robinson.uk)
#   FTP_USERNAME     - FTP account username
#   FTP_PASSWORD     - FTP account password
# Optional:
#   FTP_SERVER_DIR   - remote directory to publish into (defaults to "./", i.e. the
#                       account's default web root, usually public_html/)
#
# See README.md for full setup instructions.

on:
  push:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0 # full history so Hugo GitInfo (lastmod) works

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.72.0"
          extended: true

      - name: Build site
        run: hugo --gc --minify

      - name: Deploy over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./public/
          server-dir: ${{ secrets.FTP_SERVER_DIR || './' }}
          dangerous-clean-slate: false
